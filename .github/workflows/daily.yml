# Shot charts every hour through game time, Top 25 once a day.
#
#   Morning:  yesterday's games (re-checked for late finishes), then the
#             NCAA stats, player stats and the Top 25 re-rank.
#   Hourly:   12:30 p.m. to 1:30 a.m. Eastern, today's games finished so far,
#             shots only. One API call each, about 15 a day.
#   By hand:  everything, including today's games so far.
#
# Needs three repository secrets (Settings -> Secrets and variables ->
# Actions): SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, CBBD_API_KEY. They're
# written to a throwaway .env.local on the runner, the same file the npm
# scripts read locally, and never printed.
#
# Run it by hand any time: Actions tab -> Daily update -> Run workflow.

name: Daily update

# Started by Supabase (supabase/github-cron.sql), not GitHub's own cron,
# which ran hours late or not at all:
#   morning  11:15 UTC (7:15 a.m. Eastern in fall, 6:15 in winter)
#   hourly   :30 past, 17:30 to 06:30 UTC (12:30 p.m. to 1:30 a.m. Eastern)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "all = everything, including today's games so far"
        type: choice
        options: [all, morning, hourly]
        default: all

concurrency: daily-update

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Write .env.local from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
        run: |
          printf 'SUPABASE_URL=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\nCBBD_API_KEY=%s\n' \
            "$SUPABASE_URL" "$SUPABASE_SERVICE_ROLE_KEY" "$CBBD_API_KEY" > .env.local

      # The formula's preseason inputs (2025-26 stats, 2026-27 rosters)
      # never change. Kept between runs so they cost 3 API calls once,
      # not 3 every day.
      - name: Restore CBBD preseason payloads
        id: cbbd
        uses: actions/cache/restore@v4
        with:
          path: |
            scripts/.cache/rosters-2027.json
            scripts/.cache/team-stats-2026.json
            scripts/.cache/player-stats-2026.json
          key: cbbd-preseason-2027-v1

      # One API call per run: today's games hourly, yesterday in the morning.
      - name: Shot charts
        run: npm run update-shots ${{ inputs.mode == 'morning' && ' ' || '-- --today' }}

      # Morning and by-hand runs only. The ranking runs even if the shot
      # import failed.
      - name: NCAA.com team stats
        if: ${{ !cancelled() && inputs.mode != 'hourly' }}
        run: npm run ncaa-stats

      # Box-score stats for the player pages: one API call.
      - name: Player season stats
        if: ${{ !cancelled() && inputs.mode != 'hourly' }}
        run: npm run player-stats -- --season 2027 --refresh

      - name: Re-rank and publish today's snapshot
        if: ${{ !cancelled() && inputs.mode != 'hourly' }}
        run: npm run rank

      - name: Keep CBBD preseason payloads
        if: ${{ !cancelled() && steps.cbbd.outputs.cache-hit != 'true' && hashFiles('scripts/.cache/player-stats-2026.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: |
            scripts/.cache/rosters-2027.json
            scripts/.cache/team-stats-2026.json
            scripts/.cache/player-stats-2026.json
          key: cbbd-preseason-2027-v1
