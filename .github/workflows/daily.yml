# Shot charts, the Top 25 and Live Wire news every hour through game time.
#
#   Morning:  yesterday's games (re-checked for late finishes), then the
#             NCAA stats, player stats and the Top 25 re-rank.
#   Hourly:   12:30 p.m. to 1:30 a.m. Eastern, today's games finished so
#             far, then NCAA stats and the re-rank. One API call each
#             (the NCAA.com stats are free), about 15 a day.
#   By hand:  everything, including today's games so far.
#
# Needs three repository secrets (Settings -> Secrets and variables ->
# Actions): SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, CBBD_API_KEY. They're
# written to a throwaway .env.local on the runner, the same file the npm
# scripts read locally, and never printed.
#
# Run it by hand any time: Actions tab -> Daily update -> Run workflow.

name: Daily update

on:
  schedule:
    # 11:15 UTC: 7:15 a.m. Eastern in fall, 6:15 in winter. West Coast
    # games are long over. GitHub may start it late.
    - cron: "15 11 * * *"
    # Hourly at :30, 17:30 to 06:30 UTC: 12:30 p.m. to 1:30 a.m. Eastern
    # (an hour later in March and April, on daylight time). No games
    # finish overnight.
    - cron: "30 0-6,17-23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "all = everything, including today's games so far"
        type: choice
        options: [all, morning, hourly]
        default: all

concurrency: daily-update

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODE: ${{ inputs.mode || (github.event.schedule == '15 11 * * *' && 'morning' || 'hourly') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Write .env.local from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
        run: |
          printf 'SUPABASE_URL=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\nCBBD_API_KEY=%s\n' \
            "$SUPABASE_URL" "$SUPABASE_SERVICE_ROLE_KEY" "$CBBD_API_KEY" > .env.local

      # The formula's preseason inputs (2025-26 stats, 2026-27 rosters)
      # never change. Kept between runs so they cost 4 API calls once,
      # not 4 every day.
      - name: Restore CBBD preseason payloads
        id: cbbd
        uses: actions/cache/restore@v4
        with:
          path: |
            scripts/.cache/rosters-2027.json
            scripts/.cache/team-stats-2026.json
            scripts/.cache/player-stats-2026.json
            scripts/.cache/recruits-2026.json
          key: cbbd-preseason-2027-v2

      # Every run, first, since it's quick; free. news.yml also runs it
      # overnight, whenever GitHub gets round to its 3-hour schedule.
      - name: Live Wire news
        run: npm run fetch-news

      # One API call per run: today's games hourly, yesterday in the morning.
      # Runs even if the news fetch failed.
      - name: Shot charts
        if: ${{ !cancelled() }}
        run: npm run update-shots ${{ env.MODE == 'morning' && ' ' || '-- --today' }}

      # Every run; free. The ranking runs even if the shot import failed.
      - name: NCAA.com team stats
        if: ${{ !cancelled() }}
        run: npm run ncaa-stats

      # Box-score stats for the player pages: one API call, mornings only.
      - name: Player season stats
        if: ${{ !cancelled() && env.MODE != 'hourly' }}
        run: npm run player-stats -- --season 2027 --refresh

      # Per-game box scores for the game logs: one API call, mornings only.
      - name: Game logs
        if: ${{ !cancelled() && env.MODE != 'hourly' }}
        run: npm run game-logs

      # Final scores from ESPN for the ranking; free. Games still going
      # are left out.
      - name: Final scores
        if: ${{ !cancelled() }}
        run: npm run results

      - name: Re-rank and publish today's snapshot
        if: ${{ !cancelled() }}
        run: npm run rank

      - name: Keep CBBD preseason payloads
        if: ${{ !cancelled() && steps.cbbd.outputs.cache-hit != 'true' && hashFiles('scripts/.cache/recruits-2026.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: |
            scripts/.cache/rosters-2027.json
            scripts/.cache/team-stats-2026.json
            scripts/.cache/player-stats-2026.json
            scripts/.cache/recruits-2026.json
          key: cbbd-preseason-2027-v2
