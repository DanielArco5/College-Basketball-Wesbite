# Shot charts, the Top 25 and Live Wire news every hour through game time.
#
#   Every run:  today's games finished so far, Live Wire news, NCAA
#               stats, final scores, the re-rank, and any X post that's
#               due. One API call.
#   Once a day: the first run after 3 a.m. Eastern also re-checks
#               yesterday's late games and loads box scores and player
#               stats (three more API calls). If any of that fails, the
#               next run tries again, so no one has to run it by hand.
#   By hand:    everything, whether or not it's already been done today.
#
# GitHub starts scheduled runs late and skips many of them: of about 15
# scheduled a day, 4 or so actually run. That's enough, since no single
# run matters any more.
#
# Needs three repository secrets (Settings -> Secrets and variables ->
# Actions): SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, CBBD_API_KEY. They're
# written to a throwaway .env.local on the runner, the same file the npm
# scripts read locally, and never printed.
#
# Run it by hand any time: Actions tab -> Daily update -> Run workflow.

name: Daily update

on:
  schedule:
    # 11:15 UTC: 7:15 a.m. Eastern in fall, 6:15 in winter. West Coast
    # games are long over. GitHub may start it late.
    - cron: "15 11 * * *"
    # Hourly at :30, 17:30 to 06:30 UTC: 12:30 p.m. to 1:30 a.m. Eastern
    # (an hour later in March and April, on daylight time). No games
    # finish overnight.
    - cron: "30 0-6,17-23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "all = everything now; auto = only what's due, like a scheduled run"
        type: choice
        options: [all, auto]
        default: all

concurrency: daily-update

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Write .env.local from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
        run: |
          printf 'SUPABASE_URL=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\nCBBD_API_KEY=%s\n' \
            "$SUPABASE_URL" "$SUPABASE_SERVICE_ROLE_KEY" "$CBBD_API_KEY" > .env.local

      # The formula's preseason inputs (2025-26 stats, 2026-27 rosters)
      # never change. Kept between runs so they cost 4 API calls once,
      # not 4 every day.
      - name: Restore CBBD preseason payloads
        id: cbbd
        uses: actions/cache/restore@v4
        with:
          path: |
            scripts/.cache/rosters-2027.json
            scripts/.cache/team-stats-2026.json
            scripts/.cache/player-stats-2026.json
            scripts/.cache/recruits-2026.json
          key: cbbd-preseason-2027-v2

      # Decides whether the once-a-day work is still owed today.
      - name: What's due
        id: due
        run: npx tsx --env-file=.env.local scripts/due.ts ${{ inputs.mode == 'all' && '--force' || '' }}

      # Every run, first, since it's quick; free. news.yml also runs it
      # overnight, whenever GitHub gets round to its 3-hour schedule.
      - name: Live Wire news
        if: ${{ !cancelled() }}
        run: npm run fetch-news

      # One API call for today's games; once a day, one more to re-check
      # yesterday's. The summaries are refreshed in the last step.
      - name: Shot charts
        id: shots
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ steps.due.outputs.morning }}" = "true" ]; then
            npm run update-shots -- --no-refresh
          fi
          npm run update-shots -- --today --no-refresh

      # Every run; free. The ranking runs even if the shot import failed.
      - name: NCAA.com team stats
        if: ${{ !cancelled() }}
        run: npm run ncaa-stats

      # Box-score stats for the player pages: one API call, once a day.
      - name: Player season stats
        id: player
        if: ${{ !cancelled() && steps.due.outputs.morning == 'true' }}
        run: npm run player-stats -- --season 2027 --refresh

      # Per-game box scores for the game logs: one API call, once a day.
      - name: Game logs
        id: logs
        if: ${{ !cancelled() && steps.due.outputs.morning == 'true' }}
        run: npm run game-logs

      # Only when all of the once-a-day work succeeded; otherwise the next
      # run does it again.
      - name: Mark the daily work done
        if: ${{ steps.due.outputs.morning == 'true' && steps.shots.outcome == 'success' && steps.player.outcome == 'success' && steps.logs.outcome == 'success' }}
        run: npx tsx --env-file=.env.local scripts/due.ts --done

      # Final scores from ESPN for the ranking; free. Games still going
      # are left out.
      - name: Final scores
        if: ${{ !cancelled() }}
        run: npm run results

      - name: Re-rank and publish today's snapshot
        if: ${{ !cancelled() }}
        run: npm run rank

      # The site's X account: yesterday's hot and cold shooters once a day,
      # an unusual team shot chart every third day. Posts only what's due
      # and never twice; does nothing until the four X_ secrets are set.
      - name: Post to X
        if: ${{ !cancelled() }}
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: npm run tweet -- auto --post

      - name: Keep CBBD preseason payloads
        if: ${{ !cancelled() && steps.cbbd.outputs.cache-hit != 'true' && hashFiles('scripts/.cache/recruits-2026.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: |
            scripts/.cache/rosters-2027.json
            scripts/.cache/team-stats-2026.json
            scripts/.cache/player-stats-2026.json
            scripts/.cache/recruits-2026.json
          key: cbbd-preseason-2027-v2

      # Last, because it loads the database for a few minutes and other
      # steps fail if they run during it. Skipped when no shot was added.
      - name: Refresh shot-chart summaries
        if: ${{ !cancelled() && (steps.shots.outputs.changed == 'true' || steps.due.outputs.morning == 'true') }}
        run: npm run update-shots -- --refresh-only
