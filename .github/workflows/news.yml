# Every three hours: new ESPN and CBS Sports headlines into Live Wire.
# No API calls; reads the outlets' public RSS feeds.
#
# Needs repository secrets SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY.

name: Live Wire news

on:
  schedule:
    - cron: "40 */3 * * *"
  workflow_dispatch:

concurrency: live-wire-news

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Write .env.local from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          printf 'SUPABASE_URL=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\n' \
            "$SUPABASE_URL" "$SUPABASE_SERVICE_ROLE_KEY" > .env.local

      - run: npm run fetch-news
